<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskMaster Pro</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- LOGIN / REGISTER PAGE -->
    <div class="container auth-container" id="authView" hidden>
      <div class="header">
        <i class="fas fa-tasks task-icon"></i>
        <h1>TaskMaster Pro</h1>
        <p class="subtitle" id="authSubtitle">Welcome back! Sign in to your tasks</p>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabLogin">Login</button>
        <button type="button" class="auth-tab" id="tabRegister">Register</button>
      </div>

      <form id="authFormEl" class="auth-card" novalidate>
        <label class="field">
          <i class="fas fa-envelope"></i>
          <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        </label>
        <label class="field">
          <i class="fas fa-lock"></i>
          <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </label>
        <label class="field" id="confirmField" hidden>
          <i class="fas fa-lock"></i>
          <input type="password" id="authConfirm" placeholder="Confirm password" autocomplete="new-password" />
        </label>
        <p id="authMsg" class="auth-msg" role="alert"></p>
        <button type="submit" class="add-btn auth-submit" id="authSubmit">
          <i class="fas fa-right-to-bracket"></i>
          <span>Login</span>
        </button>
      </form>
    </div>

    <!-- TASK APP -->
    <div class="container" id="appView" hidden>
      <div class="user-bar" id="userBar" hidden>
        <span><i class="fas fa-user"></i> <span id="userEmail"></span></span>
        <button type="button" class="logout-btn" id="logoutBtn">
          <i class="fas fa-right-from-bracket"></i> Logout
        </button>
      </div>

      <div class="header">
        <i class="fas fa-tasks task-icon"></i>
        <h1>TaskMaster Pro</h1>
        <p class="subtitle">
          Your Personal Task Management Solution <i class="fas fa-star"></i>
        </p>
      </div>

      <div class="input-section">
        <div class="input-wrapper">
          <i class="fas fa-pencil input-icon"></i>
          <input type="text" id="todoInput" placeholder="Enter your task" />
        </div>
        <button onclick="addTodo()" class="add-btn">
          <i class="fas fa-plus"></i>
          <span>Add Task</span>
        </button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">
          <i class="fas fa-list"></i> All
        </button>
        <button class="filter-btn" data-filter="completed">
          <i class="fas fa-check"></i> Completed
        </button>
        <button class="filter-btn" data-filter="pending">
          <i class="fas fa-clock"></i> Pending
        </button>
      </div>

      <ul id="todoList"></ul>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
